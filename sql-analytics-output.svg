<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">SQL Analytics Output</title>
  <desc id="desc">MySQL Workbench-style view showing a department KPI aggregation query and result grid.</desc>
  <rect width="1120" height="620" fill="#f7f8fa"/>

  <rect x="0" y="0" width="1120" height="32" fill="#f2f2f2" stroke="#d0d0d0"/>
  <text x="14" y="21" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">MySQL Workbench - SQL Analytics</text>

  <rect x="0" y="32" width="154" height="588" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="16" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333333">Navigator</text>
  <text x="16" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444444">MANAGEMENT</text>
  <text x="26" y="132" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Server Status</text>
  <text x="26" y="156" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Client Connections</text>
  <text x="26" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Users and Privileges</text>
  <text x="16" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444444">INSTANCE</text>
  <text x="26" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Startup / Shutdown</text>
  <text x="26" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Administration</text>

  <rect x="154" y="72" width="785" height="214" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="154" y="72" width="785" height="28" fill="#eef6ff" stroke="#66aee8"/>
  <text x="170" y="91" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0067b1">Query 1</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="14">
    <text x="176" y="132" fill="#8a8a8a">51</text><text x="210" y="132" fill="#0076c8" font-weight="700">SELECT</text>
    <text x="176" y="156" fill="#8a8a8a">52</text><text x="230" y="156" fill="#222222">department,</text>
    <text x="176" y="180" fill="#8a8a8a">53</text><text x="230" y="180" fill="#222222">COUNT(*) AS total_visits,</text>
    <text x="176" y="204" fill="#8a8a8a">54</text><text x="230" y="204" fill="#222222">ROUND(AVG(wait_time_min), 2) AS avg_wait_time,</text>
    <text x="176" y="228" fill="#8a8a8a">55</text><text x="230" y="228" fill="#222222">ROUND(AVG(los_min), 2) AS avg_los,</text>
    <text x="176" y="252" fill="#8a8a8a">56</text><text x="230" y="252" fill="#222222">ROUND(AVG(referral_delay_days), 2) AS avg_referral_delay</text>
    <text x="176" y="276" fill="#8a8a8a">57</text><text x="210" y="276" fill="#0076c8" font-weight="700">FROM</text><text x="256" y="276" fill="#222222"> patient_visits</text>
  </g>

  <rect x="154" y="300" width="785" height="240" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="154" y="300" width="785" height="28" fill="#f1f1f1" stroke="#d8d8d8"/>
  <text x="170" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333333">Result Grid</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12">
    <rect x="174" y="342" width="520" height="28" fill="#f7f7f7" stroke="#cfcfcf"/>
    <line x1="260" y1="342" x2="260" y2="538" stroke="#d4d4d4"/>
    <line x1="344" y1="342" x2="344" y2="538" stroke="#d4d4d4"/>
    <line x1="448" y1="342" x2="448" y2="538" stroke="#d4d4d4"/>
    <line x1="540" y1="342" x2="540" y2="538" stroke="#d4d4d4"/>
    <line x1="694" y1="342" x2="694" y2="538" stroke="#d4d4d4"/>

    <text x="184" y="360" font-weight="700" fill="#333333">department</text>
    <text x="274" y="360" font-weight="700" fill="#333333">total_visits</text>
    <text x="356" y="360" font-weight="700" fill="#333333">avg_wait_time</text>
    <text x="464" y="360" font-weight="700" fill="#333333">avg_los</text>
    <text x="552" y="360" font-weight="700" fill="#333333">avg_referral_delay</text>

    <rect x="174" y="370" width="520" height="28" fill="#ffffff"/>
    <rect x="174" y="398" width="520" height="28" fill="#eaf3ff"/>
    <rect x="174" y="426" width="520" height="28" fill="#ffffff"/>
    <rect x="174" y="454" width="520" height="28" fill="#eaf3ff"/>
    <rect x="174" y="482" width="520" height="28" fill="#ffffff"/>
    <rect x="174" y="510" width="520" height="28" fill="#eaf3ff"/>

    <g fill="#222222">
      <text x="184" y="388">SURG</text><text x="280" y="388">1</text><text x="372" y="388">47.00</text><text x="470" y="388">260.00</text><text x="572" y="388">7.00</text>
      <text x="184" y="416">PED</text><text x="280" y="416">1</text><text x="372" y="416">38.00</text><text x="470" y="416">170.00</text><text x="572" y="416">4.00</text>
      <text x="184" y="444">OPD</text><text x="280" y="444">1</text><text x="372" y="444">50.00</text><text x="470" y="444">120.00</text><text x="572" y="444">6.00</text>
      <text x="184" y="472">OBGYN</text><text x="280" y="472">1</text><text x="372" y="472">28.00</text><text x="470" y="472">150.00</text><text x="572" y="472">2.00</text>
      <text x="184" y="500">IM</text><text x="280" y="500">1</text><text x="372" y="500">42.00</text><text x="470" y="500">210.00</text><text x="572" y="500">5.00</text>
      <text x="184" y="528">ED</text><text x="280" y="528">1</text><text x="372" y="528">35.50</text><text x="470" y="528">180.00</text><text x="572" y="528">3.00</text>
    </g>
  </g>

  <rect x="950" y="72" width="170" height="548" fill="#ffffff" stroke="#d8d8d8"/>
  <text x="970" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#666666">SQL Additions</text>
  <text x="970" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#888888">Automatic context help</text>
  <text x="970" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#888888">is disabled.</text>
</svg>
